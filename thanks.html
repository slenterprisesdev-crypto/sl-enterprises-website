<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – SL Enterprises</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

p{margin:0;font-size:17px;line-height:1.6;color:#4A5878}

</style>
</head>
<body>
<div class="box">
  <img src="logo.png" alt="SL Enterprises logo">
  <h1>Thank you!</h1>
  <p>We have received your enquiry. Our team will contact you on your phone or WhatsApp soon.</p>
